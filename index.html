<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReGaMa - The Social Builder Rewritten</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading ReGaMa...</div>
  <iframe id="regamaFrame" src="https://playregama.com" allowfullscreen></iframe>

  <script>
    const frame = document.getElementById('regamaFrame');
    frame.addEventListener('load', () => {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
